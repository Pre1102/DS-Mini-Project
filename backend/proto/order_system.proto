syntax = "proto3";
package order_system;

message Empty {}
message HealthReply { string service = 1; string status = 2; }
message Product { string id = 1; string name = 2; double price = 3; int32 stock = 4; }
message ProductList { repeated Product products = 1; }
message OrderRequest {
  string product_id = 1;
  int32 quantity = 2;
  string idempotency_key = 3;
  bool payment_success = 4;
}
message Order {
  string id = 1;
  string product_id = 2;
  string product_name = 3;
  int32 quantity = 4;
  double total = 5;
  string status = 6;
  string idempotency_key = 7;
  int64 clock = 8;
  string created_at = 9;
}
message OrderList { repeated Order orders = 1; }
message PaymentRequest { string order_id = 1; double amount = 2; bool succeed = 3; int64 clock = 4; }
message PaymentReply { bool success = 1; string message = 2; string transaction_id = 3; }
message StockRequest { string order_id = 1; string product_id = 2; int32 quantity = 3; int64 clock = 4; }
message StockReply { bool success = 1; string message = 2; }
message Event { string id = 1; string service = 2; string event_type = 3; string entity_id = 4; int64 clock = 5; string timestamp = 6; string data_json = 7; }
message EventList { repeated Event events = 1; int32 duplicate_count = 2; }

service Orders {
  rpc CreateOrder(OrderRequest) returns (Order);
  rpc ListOrders(Empty) returns (OrderList);
  rpc Health(Empty) returns (HealthReply);
}
service Payments {
  rpc ProcessPayment(PaymentRequest) returns (PaymentReply);
  rpc Health(Empty) returns (HealthReply);
}
service Inventory {
  rpc ListProducts(Empty) returns (ProductList);
  rpc ReserveStock(StockRequest) returns (StockReply);
  rpc ReleaseStock(StockRequest) returns (StockReply);
  rpc Health(Empty) returns (HealthReply);
}
service Notifications {
  rpc ListEvents(Empty) returns (EventList);
  rpc Health(Empty) returns (HealthReply);
}
